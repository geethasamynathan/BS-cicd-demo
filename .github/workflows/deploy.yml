name: ITTechGenie Website CI-CD

on:
  push:
    branches: [main]

  pull_request:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # ===================================
  # Job 1 - Continuous Integration
  # ===================================

  build:

    name: Build and Test

    runs-on: ubuntu-latest

    steps:

      - name: Checkout source code
        uses: actions/checkout@v6

      # NEW - Setup Node.js

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Validate required files

      - name: Validate files
        run: |
          set -e
          test -s index.html
          test -s style.css
          test -s script.js
          test -s script.test.js
          echo "All required files are available"

      # Validate JavaScript syntax

      - name: Validate JavaScript
        run: node --check script.js

      # NEW - Execute Unit Tests

      - name: Run JavaScript Unit Tests
        run: node --test script.test.js

      # Package website

      - name: Package website
        run: |
          mkdir -p dist
          cp index.html style.css script.js dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        if: github.event_name != 'pull_request'

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  # ===================================
  # Job 2 - Continuous Deployment
  # ===================================

  deploy:

    name: Deploy Website

    needs: build

    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'

    runs-on: ubuntu-latest

    permissions:
      contents: read
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4